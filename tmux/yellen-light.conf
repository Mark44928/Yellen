# Yellen light — tmux theme
# Source: tmux source-file "$HOME/Yellen/tmux/yellen-light.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#332A0D,bg=#F1E8C4"
set -g window-status-style "fg=#75673C"
set -g window-status-current-style "fg=#FBF6DE,bg=#82630C,bold"
set -g window-status-activity-style "fg=#98613A,bg=#FBF6DE"
set -g window-status-bell-style "fg=#A4442D,bg=#FBF6DE"
set -g pane-border-style "fg=#75673C"
set -g pane-active-border-style "fg=#82630C"
set -g message-style "fg=#332A0D,bg=#F1E8C4"
set -g message-command-style "fg=#332A0D,bg=#F1E8C4"
set -g mode-style "fg=#FBF6DE,bg=#82630C,bold"
set -g display-panes-active-colour "#82630C"
set -g display-panes-colour "#75673C"
set -g clock-mode-colour "#82630C"
set -g status-left "#[fg=#FBF6DE,bg=#82630C,bold] #S #[default]"
set -g status-right "#[fg=#75673C] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
