# Yellen dark — tmux theme
# Source: tmux source-file "$HOME/Yellen/tmux/yellen-dark.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#F3E8B8,bg=#24200C"
set -g window-status-style "fg=#87763B"
set -g window-status-current-style "fg=#171408,bg=#F2D14E,bold"
set -g window-status-activity-style "fg=#C98B6B,bg=#171408"
set -g window-status-bell-style "fg=#C76A52,bg=#171408"
set -g pane-border-style "fg=#87763B"
set -g pane-active-border-style "fg=#F2D14E"
set -g message-style "fg=#F3E8B8,bg=#24200C"
set -g message-command-style "fg=#F3E8B8,bg=#24200C"
set -g mode-style "fg=#171408,bg=#F2D14E,bold"
set -g display-panes-active-colour "#F2D14E"
set -g display-panes-colour "#87763B"
set -g clock-mode-colour "#F2D14E"
set -g status-left "#[fg=#171408,bg=#F2D14E,bold] #S #[default]"
set -g status-right "#[fg=#87763B] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
