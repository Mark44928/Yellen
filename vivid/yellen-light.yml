# Yellen light — vivid theme
# vivid (https://github.com/sharkdp/vivid) generates LS_COLORS from a theme file.
#
#   vivid generate yellen-light.yml                       # print LS_COLORS
#   eval "$(vivid generate yellen-light.yml)"             # or apply it
#   vivid apply yellen-light.yml -V                       # preview in the repo
colors:
  background: "#FBF6DE"
  foreground: "#332A0D"
  cursor: "#8B6E15"
  selection_background: "#EFE4B9"
  selection_foreground: "#332A0D"
  normal:
    black: "#EFE7C4"
    red: "#A4442D"
    green: "#66721F"
    yellow: "#8A6B11"
    blue: "#8B6A12"
    magenta: "#8A5F36"
    cyan: "#7A5C13"
    white: "#D3C48E"
  bright:
    black: "#75673C"
    red: "#B65C43"
    green: "#7A8829"
    yellow: "#A37E18"
    blue: "#A77A1A"
    magenta: "#A06E42"
    cyan: "#927018"
    white: "#FFFDF5"
