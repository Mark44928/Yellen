# Yellen dark — lazygit theme
# Install: cp lazygit/yellen-dark.yml ~/.config/lazygit/yellen-dark.yml
# Load: lazygit --use-config-file ~/.config/lazygit/config.yml,~/.config/lazygit/yellen-dark.yml
# Or: LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/yellen-dark.yml" lazygit

gui:
  theme:
    activeBorderColor:
      - "#F2D14E"
      - bold
    inactiveBorderColor:
      - "#87763B"
    searchingActiveBorderColor:
      - "#D8A93B"
    optionsTextColor:
      - "#F2D14E"
    selectedLineBgColor:
      - "#24200C"
    inactiveViewSelectedLineBgColor:
      - "#24200C"
    cherryPickedCommitFgColor:
      - "#F2D14E"
    cherryPickedCommitBgColor:
      - "#24200C"
    markedBaseCommitFgColor:
      - "#F2D14E"
    markedBaseCommitBgColor:
      - "#F7DE72"
    unstagedChangesColor:
      - "#C76A52"
    defaultFgColor:
      - "#F3E8B8"
    selectedLineFgColor:
      - "#F3E8B8"

  colorScheme: dark
